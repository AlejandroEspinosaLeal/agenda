[package]
name = "organizador_tareas"
version = "1.0.0"
edition = "2021"
description = "Organizador de tareas con cuadrícula de calendario mensual en Rust"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.19"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
