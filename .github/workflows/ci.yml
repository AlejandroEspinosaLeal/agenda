name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, Clippy & Tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  release:
    name: Build release asset
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $binary = "target/release/organizador_tareas.exe"
          $hashFile = "$binary.sha256"
          $hash = (Get-FileHash -Path $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  organizador_tareas.exe" | Out-File -FilePath $hashFile -Encoding ascii -NoNewline
          Get-Content $hashFile

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/organizador_tareas.exe
            target/release/organizador_tareas.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
